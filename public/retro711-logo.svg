<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="topTextArc" d="M 22 75 A 52 52 0 0 1 128 75" />
    <path id="bottomTextArc" d="M 128 75 A 52 52 0 0 1 22 75" />
  </defs>

  {/* Scalloped outer edge circle */}
  <circle cx="75" cy="75" r="72" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  
  {/* Outer Main Black Ring */}
  <circle cx="75" cy="75" r="66" fill="#151515" />
  <circle cx="75" cy="75" r="64" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 2" />
  
  {/* Inner White Circle */}
  <circle cx="75" cy="75" r="42" fill="#FFFFFF" stroke="#151515" stroke-width="2.5" />
  <circle cx="75" cy="75" r="39" fill="none" stroke="#0088e8" stroke-width="1" />

  {/* Top Arc Text: RETRO 7/11 CAFE */}
  <text fill="#FFFFFF" font-size="10" font-weight="900" font-family="sans-serif" letter-spacing="1.8">
    <textPath href="#topTextArc" start-offset="50%" text-anchor="middle">
      RETRO 7/11 CAFE
    </textPath>
  </text>

  {/* Bottom Arc Text: AUTHENTIC AND PREMIUM */}
  <text fill="#FFFFFF" font-size="7" font-weight="800" font-family="sans-serif" letter-spacing="1.2">
    <textPath href="#bottomTextArc" start-offset="50%" text-anchor="middle">
      AUTHENTIC AND PREMIUM
    </textPath>
  </text>

  {/* Banner Wings: RICH BREW */}
  <rect x="5" y="67" width="26" height="15" fill="#FFFFFF" stroke="#151515" stroke-width="1.5" rx="2" />
  <rect x="119" y="67" width="26" height="15" fill="#FFFFFF" stroke="#151515" stroke-width="1.5" rx="2" />
  <text x="18" y="78" fill="#151515" font-size="6.5" font-weight="900" font-family="sans-serif" text-anchor="middle">RICH</text>
  <text x="132" y="78" fill="#151515" font-size="6.5" font-weight="900" font-family="sans-serif" text-anchor="middle">BREW</text>

  {/* Center Cursive Blue Signature */}
  <g transform="translate(75, 72) scale(0.7)">
    <path d="M-26 -22 C-15 -25 15 -27 24 -24 C14 -12 2 -2 -10 18 C-12 22 -14 26 -16 30 M-14 -12 C-4 -12 12 -12 22 -12" fill="none" stroke="#0088e8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M20 -15 C6 -24 -20 -18 -22 0 C-24 18 -4 26 18 20 C24 18 28 14 30 8" fill="none" stroke="#0088e8" stroke-width="5" stroke-linecap="round" />
  </g>

  {/* 3 Stars at Bottom */}
  <g fill="#FFFFFF" transform="translate(75, 126)">
    <polygon points="0,-3 1,-0.8 3,-0.8 1.4,0.6 2,2.8 0,1.5 -2,2.8 -1.4,0.6 -3,-0.8 -1,-0.8" transform="translate(-10, 0)" />
    <polygon points="0,-3 1,-0.8 3,-0.8 1.4,0.6 2,2.8 0,1.5 -2,2.8 -1.4,0.6 -3,-0.8 -1,-0.8" transform="translate(0, 0) scale(1.2)" />
    <polygon points="0,-3 1,-0.8 3,-0.8 1.4,0.6 2,2.8 0,1.5 -2,2.8 -1.4,0.6 -3,-0.8 -1,-0.8" transform="translate(10, 0)" />
  </g>

  {/* Main Brand Text on Right */}
  <text x="175" y="78" fill="#FFFFFF" font-size="46" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, sans-serif" letter-spacing="1">
    RETRO <tspan fill="#0088e8">7/11</tspan> CAFE
  </text>
  <text x="178" y="112" fill="#FFFFFF" font-size="20" font-weight="700" font-family="'Cormorant Garamond', Georgia, serif" letter-spacing="4">
    A PREMIUM COFFEE CAFE
  </text>
</svg>
